<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot RAG v3 - Interface de test</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <script src="chatFunctions.js"></script>
    <script src="models.js"></script>
<script src="m3c-chatbot.js"></script>
</head>

<body>
<div class="main_container">
    <div class="container">
        <div class="header">
            <div class="header-main">
                <h1>🤖 Chatbot RAG M3C</h1>
                <p class="subtitle">Système de Questions/Réponses sur documents</p>
            </div>
             <div class="header-nav">
                <a href="m3c-chatbot.html" class="nav-link">Interface Standard</a>
                <span class="nav-separator">|</span>
                <a href="question_session.html" class="nav-link">Interface PDF+Chat</a>
                <span class="nav-separator">|</span>
            </div>
            <div class="profile-widget" id="profileWidget">
        <form class="profile-login-form" id="profileLoginForm" onsubmit="return profileWidgetLogin(event)">
            <input type="text" id="profileUsername" name="username" placeholder="Utilisateur ou email"
                   autocomplete="username" required />
            <input type="password" id="profilePassword" name="password" placeholder="Mot de passe"
                   autocomplete="current-password" required />
            <button type="submit" class="btn btn-primary" id="profileLoginBtn">Se connecter</button>
            <span class="profile-message" id="profileMessage"></span>
            <a href="auth.html" class="profile-register-link">S'inscrire</a>
        </form>
        <div class="profile-logged-in" id="profileLoggedIn" style="display:none;">
            <a href="profile.html" class="profile-user-link" id="profileUserLink">
                <span class="profile-avatar">&#128100;</span>
                <span class="profile-username" id="profileUsernameDisplay">&mdash;</span>
            </a>
            <button type="button" class="btn btn-secondary profile-logout-btn" onclick="profileWidgetLogout()">D&eacute;connexion</button>
        </div>
    </div>
</div>

        <div class="settings">
            <div class="settings-grid">
                <div class="setting-item">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="useRAG" checked>
                        <span class="setting-label">RAG</span>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="useReranking" checked>
                        <span class="setting-label">Reranking</span>
                    </label>
                </div>

                <div class="setting-item">
                    <label class="setting-label">
                        Nb sources:
                        <input type="number" id="numSources" value="3" min="1" max="10" class="setting-input">
                    </label>
                </div>
            </div>

            <!-- Sélecteur de document pour RAG -->
            <div class="document-selector-container">
                <label class="setting-label">
                    <input type="checkbox" id="useSingleDocument" onchange="toggleDocumentSelector()">
                    <span>RAG sur un document spécifique</span>
                </label>
                <div id="documentSelector" style="display: none; margin-top: 10px;">
                    <select id="selectedDocumentRAG" class="document-select">
                        <option value="">Chargement des documents...</option>
                    </select>
                </div>
            </div>

            <div class="model-selector">
                <label for="model-select" class="model-selector-label">Modèle de langage</label>
                <div class="model-select-container">
                    <select id="model-select" name="models" multiple class="model-select"></select>
                    <div class="selected-models" id="selectedModels">
                        <span class="selected-model-badge">Aucun modèle sélectionné</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    👋 Bonjour ! Je suis votre assistant M3C. Veuillez écrire votre requête<br><br>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Recherche en cours...</p>
        </div>

        <div class="input-container">
            <input
                type="text"
                id="questionInput"
                placeholder="Posez votre question ici..."
                onkeypress="if(event.key==='Enter') sendQuestion()"
            >
            <button id="sendButton" onclick="sendQuestion()">Envoyer</button>
        </div>
    </div>

    <div class="pdf-display" id="pdf-display">
        <iframe>

        </iframe>
    </div>
</div>
<script src="auth_widget.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    loadModelsIntoSelect(document.getElementById("model-select"));
  });
</script>
</body>
</html>
