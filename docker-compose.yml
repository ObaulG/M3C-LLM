version: '3.8'

services:
  # Service MySQL avec initialisation automatique
  mysql:
    image: mysql:8.0
    container_name: llmagents-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: m3c_database
      MYSQL_USER: OBL
      MYSQL_PASSWORD: azerty
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - llmagents-network
    command: --default-authentication-plugin=mysql_native_password

  # Service Qdrant - version 1.18.0 pour compatibilité avec qdrant_client 1.18.0
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: llmagents-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"  # Port gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - llmagents-network

  # Service Application FastAPI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmagents-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # Configuration MySQL
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: m3c_database
      DB_USER: OBL
      DB_PASSWORD: azerty
      # Configuration Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Configuration API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Variables pour éviter les problèmes Windows/Linux
      PYTHONASYNCIODEBUG: 0
      # clefs API
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      # Monter les répertoires de données persistantes
      - ./rag_sessions:/app/rag_sessions
      - ./rag_sessions_csv:/app/rag_sessions_csv
      - ./session_evaluations:/app/session_evaluations
      - ./temp_pdfs:/app/temp_pdfs
      - ./exports:/app/exports
    networks:
      - llmagents-network
    # Configuration pour le développement (optionnel)
    # Pour le développement, vous pouvez décommenter les lignes suivantes
    # et commenter les COPY dans le Dockerfile
    # volumes:
    #   - ./app:/app/app
    #   - ./config:/app/config
    # environment:
    #   - PYTHONPATH=/app

# Volumes pour la persistance des données
volumes:
  mysql_data:
    driver: local
  qdrant_data:
    driver: local

# Réseau dédié pour la communication entre les services
networks:
  llmagents-network:
    driver: bridge
