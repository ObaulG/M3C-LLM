version: '3.8'

services:
  # Service Qdrant - version 1.18.0 pour compatibilité avec qdrant_client 1.18.0
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: llmagents-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"  # Port gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - llmagents-network

  # Service d'initialisation Qdrant (one-shot)
  # Crée les collections Qdrant au démarrage, après que Qdrant soit sain.
  # Équivalent du docker/mysql/init.sql mais pour Qdrant (qui n'a pas de
  # mécanisme natif de scripts d'init).
  qdrant-init:
    image: curlimages/curl:latest
    container_name: llmagents-qdrant-init
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./docker/qdrant/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - llmagents-network

  # Service Application FastAPI
  # La base MySQL est externe (déjà présente sur les serveurs M3C).
  # Les identifiants et l'hôte DB sont lus depuis le fichier .env
  # (voir .env.docker / .env.example). Les tables manquantes doivent être
  # créées manuellement via docker/mysql/migrate_missing_tables.sql.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmagents-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    environment:
      # Configuration MySQL (base externe, valeurs depuis .env)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Configuration Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Configuration API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Variables pour éviter les problèmes Windows/Linux
      PYTHONASYNCIODEBUG: 0
      # Solr désactivé par défaut (non déployé en conteneur)
      SOLR_ENABLED: ${SOLR_ENABLED:-0}
      # clefs API
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      # Monter les répertoires de données persistantes
      - ./rag_sessions:/app/rag_sessions
      - ./rag_sessions_csv:/app/rag_sessions_csv
      - ./session_evaluations:/app/session_evaluations
      - ./temp_pdfs:/app/temp_pdfs
      - ./exports:/app/exports
    networks:
      - llmagents-network
    # Configuration pour le développement (optionnel)
    # Pour le développement, vous pouvez décommenter les lignes suivantes
    # et commenter les COPY dans le Dockerfile
    # volumes:
    #   - ./app:/app/app
    #   - ./config:/app/config
    # environment:
    #   - PYTHONPATH=/app

# Volumes pour la persistance des données
volumes:
  qdrant_data:
    driver: local

# Réseau dédié pour la communication entre les services
networks:
  llmagents-network:
    driver: bridge
