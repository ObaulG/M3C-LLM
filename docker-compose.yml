version: '3.8'

services:
  # Service Qdrant - version 1.18.0 pour compatibilité avec qdrant_client 1.18.0
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: llmagents-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"  # Port gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - llmagents-network

  # Service d'initialisation Qdrant (one-shot)
  # Crée les collections Qdrant au démarrage, après que Qdrant soit sain.
  # Équivalent du docker/mysql/init.sql mais pour Qdrant (qui n'a pas de
  # mécanisme natif de scripts d'init).
  qdrant-init:
    image: curlimages/curl:latest
    container_name: llmagents-qdrant-init
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./docker/qdrant/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - llmagents-network

  # Service MySQL local (optionnel)
  # Alternative à la base MySQL externe des serveurs M3C : permet d'héberger
  # la base en conteneur et d'y importer un dump SQL de la base M3C initiale
  # (voir docker/mysql/import_m3c_dump.sh). Au premier démarrage (volume
  # mysql_data vide), docker/mysql/init.sql crée la base, l'utilisateur et les
  # tables du projet.
  mysql:
    image: mysql:8.0
    container_name: llmagents-mysql
    restart: unless-stopped
    # Optimisations pour l'import de gros dumps (10 Go+) : pas de binary log,
    # flush moins strict, buffer pool InnoDB 1G (adapter selon la RAM dispo).
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --disable-log-bin
      --innodb-flush-log-at-trx-commit=2
      --innodb-io-capacity=1000
      --innodb-buffer-pool-size=1G
    environment:
      MYSQL_DATABASE: ${DB_NAME:-m3c_database}
      MYSQL_USER: ${DB_USER:-OBL}
      MYSQL_PASSWORD: ${DB_PASSWORD:-azerty}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - llmagents-network

  # Service Application FastAPI
  # Par défaut (.env.docker), l'application utilise le service MySQL local
  # ci-dessus (DB_HOST=mysql). Pour une base externe (serveurs M3C), pointez
  # DB_HOST vers le serveur concerné ; les identifiants DB sont lus depuis le
  # fichier .env (voir .env.docker / .env.example). Les tables manquantes
  # doivent être créées manuellement via docker/mysql/migrate_missing_tables.sql
  # (fait automatiquement par docker/mysql/import_m3c_dump.sh en cas d'import).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmagents-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    environment:
      # Configuration MySQL (base externe, valeurs depuis .env)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Configuration Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Configuration API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Variables pour éviter les problèmes Windows/Linux
      PYTHONASYNCIODEBUG: 0
      # Solr désactivé par défaut (non déployé en conteneur)
      SOLR_ENABLED: ${SOLR_ENABLED:-0}
      # clefs API
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      # Obliger les utilisateurs normaux à fournir leur propre clé Mistral
      # (mettre "false" pour utiliser la clé du serveur pour tous)
      REQUIRE_USER_MISTRAL_API_KEY: ${REQUIRE_USER_MISTRAL_API_KEY:-true}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Sauvegarde locale (tables MySQL du projet + collections Qdrant)
      # exécutée à l'arrêt du serveur et/ou périodiquement (app/database/local_backup.py)
      LOCAL_BACKUP_ON_SHUTDOWN: ${LOCAL_BACKUP_ON_SHUTDOWN:-true}
      LOCAL_BACKUP_INTERVAL_SECONDS: ${LOCAL_BACKUP_INTERVAL_SECONDS:-0}
      LOCAL_BACKUP_RETENTION_DAYS: ${LOCAL_BACKUP_RETENTION_DAYS:-30}
      LOCAL_BACKUP_DIR: ${LOCAL_BACKUP_DIR:-/app/backups}
    ports:
      - "8000:8000"
    volumes:
      # Monter les répertoires de données persistantes
      - ./rag_sessions:/app/rag_sessions
      - ./rag_sessions_csv:/app/rag_sessions_csv
      - ./session_evaluations:/app/session_evaluations
      - ./temp_pdfs:/app/temp_pdfs
      - ./exports:/app/exports
      - ./backups:/app/backups
    networks:
      - llmagents-network
    # Configuration pour le développement (optionnel)
    # Pour le développement, vous pouvez décommenter les lignes suivantes
    # et commenter les COPY dans le Dockerfile
    # volumes:
    #   - ./app:/app/app
    #   - ./config:/app/config
    # environment:
    #   - PYTHONPATH=/app

# Volumes pour la persistance des données
volumes:
  qdrant_data:
    driver: local
  mysql_data:
    driver: local

# Réseau dédié pour la communication entre les services
networks:
  llmagents-network:
    driver: bridge
